name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: Build app
        run: make app
      - name: Smoke test binaries
        run: |
          ./build/casio-2000s-midi-bridge --version
          ./build/casio-2000s-midi-bridge --list
