name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: make && make test
      - name: Package app
        run: make dist
      - name: Package CLI
        run: |
          mkdir -p dist && cp build/casio-2000s-midi-bridge build/midimon build/usbdesc dist/
          tar -C dist -czf "build/casio-2000s-midi-bridge-cli-${GITHUB_REF_NAME#v}.tar.gz" .
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/Casio-2000s-MIDI-Bridge-*.zip
            build/casio-2000s-midi-bridge-cli-*.tar.gz
          body: |
            **Casio 2000s MIDI Bridge.app** — unzip, drag to Applications, open.
            The app is not notarized (no paid Apple Developer ID), so the first time macOS may say it
            "cannot verify the developer": right-click the app → Open → Open, or run
            `xattr -d com.apple.quarantine "/Applications/Casio 2000s MIDI Bridge.app"`.
            Building from source with `make install-app` avoids this entirely.
